name: Apply tested evaluation implementation
on:
  push:
    branches: [work/evaluation-path-20260924]
    paths: [.delivery/**, .github/workflows/apply-evaluation.yml]
permissions:
  contents: write
jobs:
  publish-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply verified patch and publish exact Git objects without moving branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          repo = 'ReloadLightly/shinka-swarm-location'
          base = '45cc52400521063694fb63c3a92959203d0a33fa'
          expected_tree = 'a096aefcac8200723a0dca2b1f00ea319180eeab'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/work/evaluation-path-20260924'
          endpoint = 'https://api.github.com/repos/' + repo
          def api(path, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(endpoint + path, data=body, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          assert api('/git/ref/heads/main')['object']['sha'] == base, 'main advanced'
          assert api('/git/ref/heads/work/evaluation-path-20260924')['object']['sha'] == os.environ['GITHUB_SHA'], 'work branch advanced'
          payload = b''.join(pathlib.Path('.delivery/part'+str(i)).read_bytes() for i in range(4))
          patch = lzma.decompress(payload)
          assert hashlib.sha256(patch).hexdigest() == '4cc7ff486cc020feba28f724552c03ae4a83d2e4e1f520066bb3cd6c6fe804b6'
          subprocess.run(['git','apply','--check'], input=patch, check=True)
          subprocess.run(['git','apply'], input=patch, check=True)
          subprocess.run(['git','rm','-r','.delivery','.github/workflows/source-transfer.yml','.github/workflows/apply-evaluation.yml'], check=True)
          subprocess.run(['git','add','-A'], check=True)
          tree = subprocess.check_output(['git','write-tree'], text=True).strip()
          assert tree == expected_tree, (tree, expected_tree)
          changed = subprocess.check_output(['git','diff','--cached','--name-only','-z',base]).decode().strip('\0').split('\0')
          assert len(changed) == 21
          entries = []
          for name in changed:
              path = pathlib.Path(name)
              assert path.is_file() and '.delivery' not in path.parts
              blob = api('/git/blobs', {'content':base64.b64encode(path.read_bytes()).decode(),'encoding':'base64'})
              entries.append({'path':name,'mode':'100644','type':'blob','sha':blob['sha']})
          base_tree = api('/git/commits/'+base)['tree']['sha']
          remote_tree = api('/git/trees', {'base_tree':base_tree,'tree':entries})['sha']
          assert remote_tree == expected_tree
          commit = api('/git/commits', {'message':'Implement resumable full-size evaluation, shared DAG preparation and independent assessment', 'tree':remote_tree, 'parents':[os.environ['GITHUB_SHA']]})
          result = {'commit':commit['sha'],'tree':remote_tree,'changed_files':changed,'branches_updated':False}
          pathlib.Path('publication.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-publication
          path: publication.json
          retention-days: 7
