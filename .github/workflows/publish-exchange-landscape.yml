name: Publish verified exchange landscape
on:
  push:
    branches: [work/exchange-landscape]
    paths: ['.github/exchange-delivery/**', '.github/workflows/publish-exchange-landscape.yml']
permissions:
  contents: write
jobs:
  verify_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply the exact prepared patch and remove delivery-only files
        run: |
          set -eu
          test "$GITHUB_REPOSITORY" = 'ReloadLightly/shinka-swarm-location'
          test "$GITHUB_REF_NAME" = 'work/exchange-landscape'
          test "$(git rev-parse HEAD^)" = 'a7682e2e73726aff5557c00c0b7fe2c0e063e953'
          python - <<'PY'
          import hashlib,lzma,pathlib,subprocess
          parts=sorted(pathlib.Path('.github/exchange-delivery').glob('part-*.xz'))
          assert [p.name for p in parts] == ['part-00.xz','part-01.xz']
          patch=lzma.decompress(b''.join(p.read_bytes() for p in parts))
          assert hashlib.sha256(patch).hexdigest() == '8a920070eec9198b8ce5954fbd558e5897331616932bfca0aa318b178d79bafa'
          path=pathlib.Path('/tmp/exchange-landscape.patch');path.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          PY
          git rm -r -- .github/exchange-delivery .github/workflows/publish-exchange-landscape.yml
          test "$(git write-tree)" = '02929d2435b7d46ab90dc8aa74e7b2a5a8809507'
          mkdir -p /tmp/exchange-publication-checks
      - name: Install the optional LP dependency for the full test suite
        run: python -m pip install -r requirements-certificates.txt
      - name: Re-run all mathematical and protocol tests
        run: |
          python -m unittest discover -s tests -v > /tmp/exchange-publication-checks/tests.txt 2>&1
          cat /tmp/exchange-publication-checks/tests.txt
      - name: Recompute the full development census and verify the independent escape proof
        run: |
          python scripts/prepare_suite.py --download > /tmp/exchange-publication-checks/development-preparation.txt
          python scripts/exchange_study.py --output results/exchange-landscape --verify > /tmp/exchange-publication-checks/landscape-verification.json
          cat /tmp/exchange-publication-checks/landscape-verification.json
          python scripts/update_exchange_readme.py --check
          python scripts/update_quality_readme.py --check
          python scripts/verify_quality_results.py --suite data/commissioning/suite.json > /tmp/exchange-publication-checks/prior-certificate-verification.json
          test "$(git write-tree)" = '02929d2435b7d46ab90dc8aa74e7b2a5a8809507'
          git diff --exit-code
      - name: Push only the verified implementation to the exact requested repository
        run: |
          set -eu
          case "$(git remote get-url origin)" in
            https://github.com/ReloadLightly/shinka-swarm-location|https://github.com/ReloadLightly/shinka-swarm-location.git) ;;
            *) echo 'Wrong repository; refusing push'; exit 1 ;;
          esac
          git fetch origin work/exchange-landscape main
          test "$(git rev-parse origin/work/exchange-landscape)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = 'a7682e2e73726aff5557c00c0b7fe2c0e063e953'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add exact exchange census, neutral-plateau diagnosis and verified escape barrier'
          git push origin HEAD:work/exchange-landscape
          python - <<'PY'
          import json,os,pathlib,subprocess
          rev=lambda x:subprocess.check_output(['git','rev-parse',x],text=True).strip()
          record={'repository':os.environ['GITHUB_REPOSITORY'],'branch':'work/exchange-landscape',
            'commit':rev('HEAD'),'tree':rev('HEAD^{tree}'),'expected_tree':'02929d2435b7d46ab90dc8aa74e7b2a5a8809507',
            'workflow_run':os.environ['GITHUB_RUN_ID'],'patch_sha256':'8a920070eec9198b8ce5954fbd558e5897331616932bfca0aa318b178d79bafa',
            'model_calls':0,'new_holdout_assessments':0,
            'scope':'Exact prepared development-only diagnostic published after full recomputation and proof verification'}
          pathlib.Path('/tmp/exchange-publication-checks/publication.json').write_text(json.dumps(record,indent=2)+'\n')
          print(json.dumps(record,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exchange-landscape-publication-checks
          path: /tmp/exchange-publication-checks/
          retention-days: 30
