name: Feedback source snapshot
on:
  push:
    branches: [work/evidence-feedback]
    paths: [.github/workflows/feedback-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          mkdir -p /tmp/feedback-source
          git archive fc459b5cf56037005b69665f12a24b9e998e936e > /tmp/feedback-source/project.tar
          git clone https://github.com/SakanaAI/ShinkaEvolve.git /tmp/native-shinka
          git -C /tmp/native-shinka archive 9912af12d423504b8d580f4179fd15f5f88b8c50 > /tmp/feedback-source/native.tar
      - uses: actions/upload-artifact@v4
        with:
          name: feedback-exact-source
          path: /tmp/feedback-source/
          retention-days: 7
