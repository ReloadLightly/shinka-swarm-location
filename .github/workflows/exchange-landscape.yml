name: Exact exchange landscape
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the optional dependency for the complete mathematical test suite
        run: python -m pip install -r requirements-certificates.txt
      - name: Run tests without model calls
        run: |
          mkdir -p results/local_exchange_ci
          python -m unittest discover -s tests -v > results/local_exchange_ci/tests.txt 2>&1
          cat results/local_exchange_ci/tests.txt
      - name: Prepare only development data
        run: python scripts/prepare_suite.py --download
      - name: Recompute the full census and independently verify path and cut
        run: |
          python scripts/exchange_study.py --output results/exchange-landscape --verify
          python scripts/update_exchange_readme.py --check
          python scripts/verify_quality_results.py --suite data/commissioning/suite.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exchange-checks-${{ github.sha }}
          path: |
            results/local_exchange_ci/
            results/exchange-landscape/verification.json
          retention-days: 30
