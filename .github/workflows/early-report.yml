name: Interpret frozen M6 measurements
on:
  push:
    branches: [work/early-controls]
permissions:
  contents: read
jobs:
  report:
    if: contains(github.event.head_commit.message, 'REPORT_M6')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update scientific interpretation without any new solver execution
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip,json,re
          from pathlib import Path
          root=Path('.');base=root/'results/early-controls/study'
          s=json.loads((base/'summary.json').read_text())
          assert s['solver_trials']==1296 and s['failed_trials']==0 and s['repeats']==6
          pairs=[('early_iterated','iterated'),('early_dfbnb','dfbnb'),('early_potential','potential')]
          with gzip.open(base/'trials.jsonl.gz','rt') as f:raw=[json.loads(line) for line in f]
          lookup={(r['repeat'],r['dataset'],r['k'],r['seed'],r['role']):r['result'] for r in raw}
          matched=0
          for early,parent in pairs:
              for r in raw:
                  if r['role']!=early:continue
                  other=lookup[(r['repeat'],r['dataset'],r['k'],r['seed'],parent)]
                  assert other['final_coverage']==r['result']['final_coverage']
                  matched+=1
          assert matched==432
          rows={(r['scope'],r['method']):r for r in s['by_method']}
          block=['','**Finding: faster first complete deployments, but no improvement in the declared checkpoint objective.** All three mean paired checkpoint differences are slightly negative on this host. Final two-second coverage is exactly equal in every one of the 432 early-versus-parent case pairs. This is a negative result for checkpoint-score improvement, not a failure to execute the prefix.','','| Anaheim: mean first complete deployment | Original (ms) | Early variant (ms) |','|---|---:|---:|']
          for early,parent in pairs:
              a,b=rows['Anaheim',parent],rows['Anaheim',early]
              assert b['complete_by_checkpoint'][0]==0 and b['trials']==72
              block.append(f"| {early} / {parent} | {1000*a['first_complete_seconds']['mean']:.3f} | {1000*b['first_complete_seconds']['mean']:.3f} |")
          block+=['','On Anaheim, the complete singleton-ranked answer arrives at roughly 21 ms rather than 63 ms, but all 72 trials of each new variant miss the 20 ms checkpoint. The full curves show the earlier availability between checkpoints; it is not rewarded by the four-point objective. The prefix also delays the small local-search gain visible at 100 ms. On Sioux Falls, both versions already supply a complete deployment by 20 ms. **First-complete latency is not time to equal coverage:** the initial singleton-ranked deployment can be weaker than the parent\'s first complete solution.','','The identical-control pair has zero *checkpoint-score* difference in all six blocks, while its receipt timestamps vary. This does not establish zero timing noise. No checkpoint was moved, no budget extended, and no variant selected after seeing the measurements to obtain a favorable result. The three early controls remain separately named and included in the predeclared optional assessment set, so evolution receives no novelty credit merely for assembling this existing initialization pattern.','']
          marker='<!-- M6-INTERPRETATION:START -->';end='<!-- M6-INTERPRETATION:END -->'
          p=root/'README.md';text=p.read_text();assert marker not in text
          text=re.sub(r'\*\*Status:[^\n]*', '**Status: M6 early-incumbent controls implemented and measured on Docker; first complete deployments arrive sooner, but the declared checkpoint objective does not improve. Section 5.8 preserves the negative result. No evolutionary campaign completed.**',text,count=1)
          old='| LLM-generated descendants / evolutionary runs |'
          assert old in text
          text=text.replace(old,'| Early-incumbent control ablation | 1,296 Docker trials; three paired variants; no checkpoint-score improvement; Section 5.8 |\n| Opt-in M6 assessment profile | Four screening and ten assessment controls; no research holdout evaluation |\n'+old,1)
          point='<!-- M6-EARLY-CONTROLS:END -->';assert text.count(point)==1
          text=text.replace(point,point+'\n\n'+marker+'\n'+'\n'.join(block)+'\n'+end,1)
          p.write_text(text)
          print('Interpreted all 432 preserved pairs; zero new solver/model calls.')
          PY
          test "$(git remote get-url origin)" = "https://github.com/ReloadLightly/shinka-swarm-location"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Interpret early availability separately from the unchanged checkpoint objective'
          git push origin HEAD:work/early-controls
