name: Source transfer
on:
  push:
    branches: [work/evaluation-path-20260924]
    paths: [.github/workflows/source-transfer.yml]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive exact source and public assessment metadata
        run: |
          mkdir transfer
          git archive 45cc52400521063694fb63c3a92959203d0a33fa > transfer/source.tar
          git ls-tree -r 45cc52400521063694fb63c3a92959203d0a33fa > transfer/source-tree.txt
          python - <<'PY'
          import json, pathlib, urllib.request
          base = 'https://api.github.com/repos/bstabler/TransportationNetworks/git/trees/d1639b4ef218c17928ba573e806ddf8ba5e7ae6d?recursive=1'
          tree = json.load(urllib.request.urlopen(base))
          pathlib.Path('transfer/upstream-tree.json').write_text(json.dumps(tree))
          raw = 'https://raw.githubusercontent.com/bstabler/TransportationNetworks/d1639b4ef218c17928ba573e806ddf8ba5e7ae6d/'
          for item in tree['tree']:
              path = item['path']
              if path.split('/')[0] not in ('Philadelphia','Birmingham-England','GoldCoast','Barcelona'):
                  continue
              if path.endswith('.tntp') and ('net' in path.lower() or 'trips' in path.lower()) or path.endswith('README.md'):
                  target = pathlib.Path('transfer/assessment-inputs') / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(urllib.request.urlopen(raw + path).read())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-path-inputs
          path: transfer/
          retention-days: 7
