name: Current experiment checks
on:
  push:
    branches: [main, work/evaluation-path-20260924]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  current-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mathematical and protocol regressions
        run: |
          python -m pip install -r requirements-certificates.txt
          mkdir -p results/local_ci
          python -m unittest discover -s tests -v > results/local_ci/tests.txt 2>&1
          tail -8 results/local_ci/tests.txt
      - name: Construct a current-protocol integration fixture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from swarm_location.suite import file_sha256
          root = Path('data/local_ci'); root.mkdir(parents=True, exist_ok=True)
          data = {'schema_version': 2, 'name': 'ci-diamond', 'nodes': [0,1,2,3],
                  'edges': [[0,1,0],[0,2,0],[1,3,1],[2,3,1]], 'od': [[0,3,1]]}
          path = root/'instance.json'; path.write_text(json.dumps(data))
          suite = {'schema_version': 2, 'research_protocol': 'chapter-search-v2',
                   'checkpoints_seconds': [.05,.1,.3,1.], 'seeds': [0],
                   'relabel_seed': 90231, 'setup_timeout_seconds': 120,
                   'fitness': {'coverage_weight': .5, 'certificate_weight': .5},
                   'controls': ['greedy', 'program:controls/dag_potential.py'],
                   'datasets': [{'id': 'ci', 'source_graph': 'ci', 'split': 'development',
                                 'path': path.name, 'sha256': file_sha256(path), 'budgets': [2]}]}
          (root/'suite.json').write_text(json.dumps(suite))
          PY
          python evaluate_search.py --suite data/local_ci/suite.json --build-references --trusted-local
      - name: Native ShinkaEvolve configuration and seed integration, without model calls
        run: |
          python -m pip install -e . -r requirements-shinka.txt
          python run_evo.py --check-native --suite data/local_ci/suite.json --results-dir results/local_ci/native
          python run_evo.py --native-seed --trusted-local --suite data/local_ci/suite.json --results-dir results/local_ci/native
      - name: Docker execution, immutable preparation, and resumed evaluation
        run: |
          docker pull python:3.11-slim
          export SWARM_TEST_DOCKER_IMAGE="$(docker image inspect --format '{{.Id}}' python:3.11-slim)"
          python -m unittest discover -s tests -p test_docker_execution.py -v > results/local_ci/docker-tests.txt 2>&1
          cat results/local_ci/docker-tests.txt
      - name: Ensure checks do not rewrite the experiment specification
        run: git diff --exit-code -- README.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-experiment-checks-${{ github.sha }}
          path: results/local_ci/
          retention-days: 30
