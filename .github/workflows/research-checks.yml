name: Research checks
on:
  push:
    branches: [main, work/m2-anytime-native]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reference tests
        run: python -m unittest discover -s tests -v
      - name: Prepare hash-pinned development data
        run: python scripts/prepare_suite.py --download
      - uses: actions/upload-artifact@v4
        with:
          name: development-data-${{ github.sha }}
          path: data/commissioning/
          retention-days: 7
      - name: Install pinned native framework
        run: python -m pip install -e . -r requirements-shinka.txt
      - name: Native M1 seed adapter (no model calls)
        run: python evaluate.py --backend shinka --program_path initial.py --results_dir results/local_native_ci
      - name: Archive exact source
        if: always()
        run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-${{ github.sha }}
          path: |
            source.tar
            results/local_native_ci/
          retention-days: 7
