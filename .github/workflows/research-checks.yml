name: Research checks
on:
  push:
    branches: [main, work/m2-anytime-native]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reference tests
        run: python -m unittest discover -s tests -v
      - name: Archive exact source
        if: always()
        run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-${{ github.sha }}
          path: source.tar
          retention-days: 7
