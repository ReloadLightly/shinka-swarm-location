name: Docker timing calibration
on:
  push:
    branches: [work/timing-calibration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact source workspace
        run: git archive --format=tar HEAD > /tmp/timing-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: timing-source-${{ github.sha }}
          path: /tmp/timing-source.tar
          retention-days: 7
