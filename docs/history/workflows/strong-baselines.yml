name: Strong fixed baselines
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the optional dependency used by the full historical test suite
        run: python -m pip install -r requirements-certificates.txt
      - name: Test fixed solvers, exact bounds and the current evaluator
        run: |
          mkdir -p results/local_strong_ci
          python -m unittest discover -s tests -v > results/local_strong_ci/tests.txt 2>&1
          cat results/local_strong_ci/tests.txt
      - name: Check the historical result blocks in the current README
        run: |
          python scripts/update_strong_readme.py --check
          python scripts/update_quality_readme.py --check
          python scripts/update_exchange_readme.py --check
      # The frozen study hashes the entire old evaluator, not only its unchanged
      # scoring code. Do not rewrite that manifest to match M4 or disable its guard.
      - uses: actions/checkout@v4
        with:
          ref: a2f9f268d231ec8caae3b6987392eb643967dd60
          path: historical-strong-source
          persist-credentials: false
      - name: Strict original-source replay of saved deployments and online bounds
        working-directory: historical-strong-source
        run: |
          python scripts/prepare_suite.py --download
          python scripts/strong_baseline_study.py --output results/strong-baselines/study --verify > "$GITHUB_WORKSPACE/results/local_strong_ci/replay.json"
          cat "$GITHUB_WORKSPACE/results/local_strong_ci/replay.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strong-baseline-checks-${{ github.sha }}
          path: results/local_strong_ci/
          retention-days: 30
