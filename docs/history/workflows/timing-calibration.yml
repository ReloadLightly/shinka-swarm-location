name: Docker timing calibration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: Verify archived evidence, or collect a new development-only measurement
        type: choice
        options: [verify, measure]
        default: verify
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.action != 'measure'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Current tests and preservation of previous scientific evidence
        run: |
          set -euo pipefail
          python -m pip install -r requirements-certificates.txt
          mkdir -p results/local_m5_ci
          python -m unittest discover -s tests -v > results/local_m5_ci/tests.txt 2>&1
          tail -5 results/local_m5_ci/tests.txt
          python scripts/check_m4_continuity.py --allow-source-change swarm_location/strong_baselines.py --output results/local_m5_ci/continuity.json
      # Keep strict source verification without rewriting the historical manifest.
      - uses: actions/checkout@v4
        with:
          ref: 402789ac41877533f64e07f78c3ae532e33c4b28
          path: historical-timing-source
          persist-credentials: false
      - name: Replay every archived trial with its exact measured source
        working-directory: historical-timing-source
        run: |
          set -euo pipefail
          python scripts/prepare_research.py --split development --download --comparison-profile configs/comparisons_m4.json --output data/commissioning_m4 > "$GITHUB_WORKSPACE/results/local_m5_ci/prepare.txt"
          python scripts/calibrate_timing.py --suite data/commissioning_m4/suite.json --output "$GITHUB_WORKSPACE/results/timing-calibration/study" --verify > "$GITHUB_WORKSPACE/results/local_m5_ci/replay.txt"
          python - <<'PY'
          import os, pathlib, json, hashlib
          from scripts.calibrate_timing import readme_block, START, END
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          base=root/'results/timing-calibration'
          summary=json.loads((base/'study/summary.json').read_text())
          text=(root/'README.md').read_text()
          assert text.split(START)[1].split(END)[0].strip()==readme_block(summary).strip()
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          figures=json.loads((base/'figures/renderer.json').read_text())
          assert figures['source_curves_sha256']==sha(base/'study/curves.json')
          assert figures['source_summary_sha256']==sha(base/'study/summary.json')
          assert figures['script_sha256']==sha(root/'scripts/render_timing.py')
          assert {p['path'] for p in figures['plots']}=={'SiouxFalls.png','Anaheim.png','null-distributions.png'}
          for p in figures['plots']:
              assert sha(base/'figures'/p['path'])==p['sha256']
          print('Archived timing table and all three diagnostic figures match their evidence.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing-replay-${{ github.sha }}
          path: results/local_m5_ci/
          retention-days: 30
  measure:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'measure'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare development and resolve the explicit executor image
        run: |
          set -euo pipefail
          python scripts/prepare_research.py --split development --download --comparison-profile configs/comparisons_m4.json --output data/commissioning_m4
          docker pull python@sha256:da047cb8f9d1d98e5c070f5300ba9f7274e33b8fc0e5be5ed88740aed1b95ba9
          IMAGE_ID=$(docker image inspect python@sha256:da047cb8f9d1d98e5c070f5300ba9f7274e33b8fc0e5be5ed88740aed1b95ba9 --format '{{.Id}}')
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"
      - name: New measurement only; no replacement of archived results or README
        run: |
          python scripts/calibrate_timing.py --suite data/commissioning_m4/suite.json --docker-image "$IMAGE_ID" --output results/local_timing_measurement
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-docker-timing-${{ github.run_id }}
          path: |
            results/local_timing_measurement/
            data/commissioning_m4/
          retention-days: 30
